#onb .btn{width:100%;flex:none}
.obcard{position:absolute;left:24px;right:24px;top:40%;background:var(--sf);border-radius:14px;padding:20px;display:flex;align-items:center;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);text-align:left}
.obsel,.obin{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--in);color:var(--tx);font:inherit}
.obbar{width:70%;height:4px;background:var(--ln);border-radius:2px;overflow:hidden}
.obbar i{display:block;height:100%;width:0;background:var(--g);transition:width 2.4s linear}
#pg i{position:relative;overflow:hidden}
#pg i b{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
#sn,#sf,#pg{transition:opacity .15s}
#story.hold #sn,#story.hold #sf,#story.hold #pg{opacity:0}
#story.rep .rpb>button:not(#srs){display:none}
#sre{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:rgba(20,16,36,.94);border-radius:18px;padding:12px;font-size:14px;font-weight:400;z-index:2}
.sreg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.sreg button{font-size:30px;height:48px;border-radius:12px}
.mcard{width:100%;max-width:320px;background:rgba(0,0,0,.45);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:center;font-weight:400}
.mart{width:100%;max-width:260px;border-radius:14px}
.mcard input[type=range]{width:100%}
.mtime{display:flex;justify-content:space-between;width:100%;font-size:12px;opacity:.8}
.mctl{display:flex;gap:26px;align-items:center}
.mctl button{width:56px;height:56px;display:grid;place-items:center;color:#fff}
.mn{color:var(--ice);font-weight:600}
.b.me .mn{color:#d6f0ff;text-decoration:underline}
.mn.me{background:rgba(123,227,255,.25);border-radius:4px;padding:0 3px}
#mnt{position:absolute;left:8px;right:8px;bottom:70px;z-index:4;background:var(--sf);border:1px solid var(--ln);border-radius:14px;max-height:210px;overflow-y:auto;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#mnt button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 12px;text-align:left}
#mnt button:active{background:var(--ln)}
.vwrap{position:relative;margin:8px 14px;border-radius:12px;overflow:hidden}
.vwrap img,.vwrap video{width:100%;display:block}
.vwrap .wm{position:absolute;inset:0;pointer-events:none;background-repeat:repeat}
.vblur>*:not(.wm){filter:blur(26px)}
.vblur::after{content:"Press and hold to view";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:600;text-shadow:0 1px 6px #000;text-align:center}
.vo-protect{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media print{#sheet{display:none!important}}
</style>
